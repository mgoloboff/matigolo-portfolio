<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 1200px;
  background: #ddd9d3;
  position: relative;
  overflow: hidden;
}

/* Noise texture overlay */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  z-index: 1;
  pointer-events: none;
}

.container {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Main full screenshot - positioned back-right */
.main-screen {
  position: absolute;
  top: 40px;
  right: -60px;
  width: 1050px;
  border-radius: 18px;
  box-shadow: 0 25px 80px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.08);
  overflow: hidden;
  z-index: 2;
}
.main-screen img {
  display: block;
  width: 100%;
  height: auto;
}

/* Cropped detail of the Oz chat panel - positioned front-left */
.detail-screen {
  position: absolute;
  bottom: 40px;
  left: 20px;
  width: 420px;
  border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.22), 0 10px 30px rgba(0,0,0,0.10);
  overflow: hidden;
  z-index: 3;
  background: white;
}
.detail-screen img {
  display: block;
  width: 1400px;
  max-width: none;
  margin-left: -980px;
  margin-top: -30px;
}
</style>
</head>
<body>
<div class="container">
  <!-- Main screenshot -->
  <div class="main-screen">
    <img src="/Users/matiasgoloboff/matigolo-portfolio/public/agentic-copilot-hero.png" />
  </div>
  <!-- Cropped Oz chat panel detail -->
  <div class="detail-screen">
    <img src="/Users/matiasgoloboff/matigolo-portfolio/public/agentic-copilot-hero.png" />
  </div>
</div>
</body>
</html>
